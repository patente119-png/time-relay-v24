<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>낙타등 도로 | 염하강 3D 시뮬레이션 V3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #38bdf8; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", Roboto, sans-serif; user-select: none; }
    #canvas-container { position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; z-index: 0 !important; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .glass-panel { background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.14); box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55); }
    .control-drawer { transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1); will-change: transform; }
    .slider-accent { accent-color: #10b981; }
  </style>
</head>
<body class="text-white">

  <div id="canvas-container"></div>

  <!-- 1. 최상단 상태 정보 헤더 바 (구간명 클릭 시 바로 조정창 이동 / 우측 상단 샷버튼 삭제 완료) -->
  <header class="fixed top-3 left-3 right-3 z-30 flex items-start justify-between gap-2 pointer-events-none">
    <div class="flex flex-col gap-1.5 pointer-events-auto">
      <button id="btn-header-sec-trigger" class="glass-panel flex items-center gap-2 px-3.5 py-1.5 rounded-full border border-emerald-500/40 hover:bg-emerald-600/30 active:scale-95 transition-all cursor-pointer shadow-lg group">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="header-sec-name" class="text-xs sm:text-sm font-bold text-emerald-300 group-hover:text-white">현재구간: ① ⚓ 대명항 어항구간</span>
        <span class="text-[10px] text-emerald-400/80 bg-emerald-950/60 px-2 py-0.5 rounded-full border border-emerald-500/30">설정 ⚙️</span>
      </button>

      <div class="glass-panel px-3.5 py-2 rounded-xl border border-white/10 text-[11px] sm:text-xs text-slate-300 flex flex-col gap-0.5 shadow-xl">
        <div class="flex items-center gap-2">
          <span>주행거리 <strong id="hud-dist" class="text-white">0 m</strong> / <span class="text-slate-400">5,000 m</span></span>
          <span class="text-slate-500">|</span>
          <span>시작 후 경과 <strong id="hud-timer" class="text-emerald-300">00:00</strong></span>
          <span class="text-slate-500">|</span>
          <span>속도 <strong id="hud-speed" class="text-amber-300">35 km/h</strong></span>
        </div>
        <div class="text-[10px] text-slate-400 flex items-center gap-1 mt-0.5">
          <span>🚐 승합차 탑승 시점 · 도로 양측 자전거도로 & 이중 가드레일</span>
        </div>
      </div>
    </div>
  </header>

  <!-- 하단 좌측 안내 문구 -->
  <div class="fixed bottom-16 left-3 z-20 pointer-events-none hidden sm:block">
    <div class="glass-panel px-3 py-1.5 rounded-lg text-[10px] text-slate-400 border border-white/5">
      좌측: 염하강 해협 & 수변 황토 자전거길 (이중 가드레일)<br>
      우측: 내륙 황토 자전거길 (이중 가드레일) & 김포 솔숲
    </div>
  </div>

  <!-- 토스트 알림창 -->
  <div id="toast-popup" class="fixed top-24 left-1/2 -translate-x-1/2 z-40 transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-2">
    <div class="glass-panel px-4 py-2 rounded-xl border border-emerald-400/40 text-emerald-300 text-xs sm:text-sm font-semibold flex items-center gap-2 shadow-2xl">
      <span id="toast-icon">💾</span>
      <span id="toast-text">설정이 저장되었습니다.</span>
    </div>
  </div>

  <!-- 2. 하단 조작 바 -->
  <div class="fixed bottom-4 left-3 right-3 z-30 flex flex-col gap-2 pointer-events-none max-w-md mx-auto">
    <div class="glass-panel pointer-events-auto p-1.5 rounded-2xl flex items-center justify-between gap-1 border border-white/10 shadow-2xl">
      <button id="btn-pause" class="px-3 py-1.5 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-xs font-bold text-slate-300 flex items-center gap-1">
        ⏸️ <span class="hidden sm:inline">일시정지</span>
      </button>
      <div class="flex items-center gap-1">
        <button id="btn-view-drone1" class="px-2.5 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700">🚁 1인칭 드론</button>
        <button id="btn-view-driver" class="px-2.5 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700">🚘 운전자</button>
        <button id="btn-view-van" class="px-2.5 py-1.5 rounded-xl text-xs font-black bg-emerald-500 text-slate-950">🚐 승합차</button>
      </div>
    </div>
  </div>

  <!-- 3. 구간별 조절 드로어 -->
  <aside id="adjust-drawer" class="control-drawer fixed bottom-0 left-0 right-0 z-50 glass-panel rounded-t-3xl p-5 border-t border-emerald-500/30 transform translate-y-full max-h-[82vh] overflow-y-auto max-w-xl mx-auto shadow-2xl">
    <div class="flex items-center justify-between pb-3 border-b border-white/10 mb-4">
      <div class="flex items-center gap-2">
        <span class="text-base font-bold text-emerald-400">⚙️ 구간 상세 설계 조정</span>
        <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">최대속도 50km/h 제한</span>
      </div>
      <button id="btn-drawer-close" class="p-1.5 rounded-full text-slate-400 hover:text-white hover:bg-slate-800">
        ✕
      </button>
    </div>

    <div class="grid grid-cols-5 gap-1 mb-4 bg-slate-900/60 p-1 rounded-xl">
      <button data-sec="0" class="sec-tab-btn py-1.5 text-[11px] font-bold rounded-lg bg-emerald-500 text-slate-950">① 대명항</button>
      <button data-sec="1" class="sec-tab-btn py-1.5 text-[11px] font-bold rounded-lg text-slate-400 hover:bg-slate-800">② 덕포진</button>
      <button data-sec="2" class="sec-tab-btn py-1.5 text-[11px] font-bold rounded-lg text-slate-400 hover:bg-slate-800">③ 피난처</button>
      <button data-sec="3" class="sec-tab-btn py-1.5 text-[11px] font-bold rounded-lg text-slate-400 hover:bg-slate-800">④ 노을쉼터</button>
      <button data-sec="4" class="sec-tab-btn py-1.5 text-[11px] font-bold rounded-lg text-slate-400 hover:bg-slate-800">⑤ 문수산성</button>
    </div>

    <div class="space-y-4 text-xs">
      <div class="bg-slate-900/40 p-3 rounded-xl border border-white/5">
        <div class="flex justify-between items-center mb-1.5">
          <span class="font-semibold text-slate-300">📐 고저차 (낙타등 높낮이)</span>
          <span id="drawer-amp-val" class="font-bold text-emerald-400 text-sm">1.1m</span>
        </div>
        <input id="slider-amp" type="range" min="0.2" max="3.5" step="0.1" value="1.1" class="w-full slider-accent h-1.5 bg-slate-700 rounded-lg cursor-pointer">
      </div>

      <div class="bg-slate-900/40 p-3 rounded-xl border border-white/5">
        <div class="flex justify-between items-center mb-1.5">
          <span class="font-semibold text-slate-300">〰️ 파장 길이 (최소 50m ~ 최대 350m)</span>
          <span id="drawer-wl-val" class="font-bold text-emerald-400 text-sm">260m</span>
        </div>
        <input id="slider-wl" type="range" min="50" max="350" step="5" value="260" class="w-full slider-accent h-1.5 bg-slate-700 rounded-lg cursor-pointer">
      </div>

      <div class="bg-slate-900/40 p-3 rounded-xl border border-white/5">
        <div class="flex justify-between items-center mb-1.5">
          <span class="font-semibold text-slate-300">⚡ 권장 주행속도 (최대 50)</span>
          <span id="drawer-speed-val" class="font-bold text-amber-400 text-sm">35 km/h</span>
        </div>
        <input id="slider-speed" type="range" min="15" max="50" step="1" value="35" class="w-full slider-accent h-1.5 bg-slate-700 rounded-lg cursor-pointer">
      </div>

      <button id="btn-save-section" class="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-black text-sm tracking-wide shadow-lg shadow-emerald-500/20 active:scale-98 transition-all flex items-center justify-center gap-2">
        💾 이 구간 설정 저장 후 닫기
      </button>

      <div class="flex justify-between pt-1 text-[11px] text-slate-400">
        <button id="btn-reset-defaults" class="hover:text-rose-400 underline">기본값 복원</button>
      </div>
    </div>
  </aside>

  <!-- 4. Three.js 3D 엔진 -->
  <script>
    (function initSimulation() {
      if (typeof THREE === 'undefined') {
        setTimeout(initSimulation, 40);
        return;
      }

      try {
        localStorage.removeItem('gimpo_road_sections');
      } catch(e) {}

      const TOTAL_ROAD_LENGTH = 5000;
      const NUM_SEGMENTS = 2000;
      const step = TOTAL_ROAD_LENGTH / NUM_SEGMENTS;

      const defaultSections = [
        { name: "① ⚓ 대명항 어항구간", start: 0, end: 900, amp: 1.1, wl: 260, speed: 35 },
        { name: "② 🌊 덕포진 역사구간", start: 900, end: 1700, amp: 1.5, wl: 280, speed: 35 },
        { name: "③ 🆘 염하강 평화피난처 구간", start: 1700, end: 2500, amp: 1.0, wl: 260, speed: 35 },
        { name: "④ ☕ 노을 복합쉼터 구간", start: 2500, end: 3500, amp: 0.8, wl: 280, speed: 30 },
        { name: "⑤ 🌲 문수산성 가로수길 구간", start: 3500, end: 5000, amp: 1.3, wl: 260, speed: 40 }
      ];

      let sectionData = defaultSections;

      const container = document.getElementById('canvas-container');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x38bdf8);
      scene.fog = null;

      const camera = new THREE.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.5, 6000);
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.95);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xfffbeb, 1.25);
      dirLight.position.set(-300, 600, 300);
      scene.add(dirLight);

      // 도로 중심선 계산
      const R_MAJOR = 620;
      const R_MINOR = 380;

      function getSectionAtDistance(dist) {
        const d = ((dist % TOTAL_ROAD_LENGTH) + TOTAL_ROAD_LENGTH) % TOTAL_ROAD_LENGTH;
        for (let i = 0; i < sectionData.length; i++) {
          if (d >= sectionData[i].start && d < sectionData[i].end) return { sec: sectionData[i], idx: i };
        }
        return { sec: sectionData[0], idx: 0 };
      }

      // 구간 변경 지점에서도 고저차가 끊기지 않도록 부드럽게 보간한다.
      function smoothstep(t) {
        t = Math.max(0, Math.min(1, t));
        return t * t * (3 - 2 * t);
      }
      function getSmoothSectionValue(dist, key) {
        const d = ((dist % TOTAL_ROAD_LENGTH) + TOTAL_ROAD_LENGTH) % TOTAL_ROAD_LENGTH;
        const { sec, idx } = getSectionAtDistance(d);
        const blendHalf = 65;
        const prev = sectionData[(idx - 1 + sectionData.length) % sectionData.length];
        const next = sectionData[(idx + 1) % sectionData.length];
        if (d - sec.start < blendHalf) {
          const t = smoothstep((d - sec.start + blendHalf) / (2 * blendHalf));
          return prev[key] * (1 - t) + sec[key] * t;
        }
        if (sec.end - d < blendHalf) {
          const t = smoothstep((sec.end - d + blendHalf) / (2 * blendHalf));
          return next[key] * (1 - t) + sec[key] * t;
        }
        return sec[key];
      }
      // 파장을 실제 주기로 반영하면서 시작점 이음새를 맞추는 위상표.
      const PHASE_SAMPLES = 1000;
      let roadPhaseTable = new Float64Array(PHASE_SAMPLES + 1);
      function rebuildRoadPhase() {
        roadPhaseTable[0] = 0;
        for (let i = 1; i <= PHASE_SAMPLES; i++) {
          const d = (i - 0.5) * TOTAL_ROAD_LENGTH / PHASE_SAMPLES;
          const wl = Math.max(50, getSmoothSectionValue(d, 'wl'));
          roadPhaseTable[i] = roadPhaseTable[i - 1] + (TOTAL_ROAD_LENGTH / PHASE_SAMPLES) / wl;
        }
        const cycles = Math.max(1, Math.round(roadPhaseTable[PHASE_SAMPLES]));
        const scale = (Math.PI * 2 * cycles) / roadPhaseTable[PHASE_SAMPLES];
        for (let i = 0; i <= PHASE_SAMPLES; i++) roadPhaseTable[i] *= scale;
      }
      function getRoadPhase(d) {
        const pos = d / TOTAL_ROAD_LENGTH * PHASE_SAMPLES;
        const i = Math.min(PHASE_SAMPLES - 1, Math.floor(pos));
        const t = pos - i;
        return roadPhaseTable[i] * (1 - t) + roadPhaseTable[i + 1] * t;
      }
      rebuildRoadPhase();

      function getRoadCenterPoint(dist) {
        const d = ((dist % TOTAL_ROAD_LENGTH) + TOTAL_ROAD_LENGTH) % TOTAL_ROAD_LENGTH;
        const theta = (d / TOTAL_ROAD_LENGTH) * Math.PI * 2;
        const x = Math.sin(theta) * R_MAJOR;
        const z = -Math.cos(theta) * R_MINOR;
        const amp = Math.min(2.0, Math.max(0.2, getSmoothSectionValue(d, 'amp')));
        // 구간별 파장을 반영한 연속 파형. 위상표를 한 바퀴 정수 주기로 보정.
        const phase = getRoadPhase(d);
        const wave = Math.sin(phase);
        const y = 6.2 + amp * wave;
        return new THREE.Vector3(x, y, z);
      }

      function getRoadTangent(dist) {
        const p1 = getRoadCenterPoint(dist - 2.0);
        const p2 = getRoadCenterPoint(dist + 2.0);
        return p2.clone().sub(p1).normalize();
      }

      function getRoadLeftVector(dist) {
        const tangent = getRoadTangent(dist);
        const up = new THREE.Vector3(0, 1, 0);
        return new THREE.Vector3().crossVectors(up, tangent).normalize(); // 좌측 수변
      }

      function getRoadRightVector(dist) {
        return getRoadLeftVector(dist).clone().negate(); // 우측 내륙
      }

      function createStripGeometry(segments) {
        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array((segments + 1) * 2 * 3);
        const indices = [];

        for (let i = 0; i < segments; i++) {
          const a = i * 2;
          const b = i * 2 + 1;
          const c = (i + 1) * 2;
          const d = (i + 1) * 2 + 1;
          indices.push(a, b, c);
          indices.push(b, d, c);
        }

        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.setIndex(indices);
        return geo;
      }

      // 1. 차도 아스팔트 상판 (폭 7.3m)
      const roadGeo = createStripGeometry(NUM_SEGMENTS);
      const roadMesh = new THREE.Mesh(
        roadGeo,
        new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.85, metalness: 0.15, side: THREE.DoubleSide })
      );
      scene.add(roadMesh);

      // 2. 황색 복선 중앙선
      const centerLineGeo = createStripGeometry(NUM_SEGMENTS);
      const centerLineMesh = new THREE.Mesh(
        centerLineGeo,
        new THREE.MeshBasicMaterial({ color: 0xfbbf24, side: THREE.DoubleSide })
      );
      scene.add(centerLineMesh);

      // 3. ★ 좌측 수변 황토색 자전거 전용도로 (폭 1.75m)
      const bikeLeftGeo = createStripGeometry(NUM_SEGMENTS);
      const bikeLeftMesh = new THREE.Mesh(
        bikeLeftGeo,
        new THREE.MeshStandardMaterial({ color: 0xb45309, roughness: 0.85, side: THREE.DoubleSide })
      );
      scene.add(bikeLeftMesh);

      // 4. 좌측 자전거도로 구분선 (백색)
      const bikeLeftLineGeo = createStripGeometry(NUM_SEGMENTS);
      const bikeLeftLineMesh = new THREE.Mesh(
        bikeLeftLineGeo,
        new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide })
      );
      scene.add(bikeLeftLineMesh);

      // 5. ★ 우측 내륙 황토색 자전거 전용도로 (폭 1.75m)
      const bikeRightGeo = createStripGeometry(NUM_SEGMENTS);
      const bikeRightMesh = new THREE.Mesh(
        bikeRightGeo,
        new THREE.MeshStandardMaterial({ color: 0xb45309, roughness: 0.85, side: THREE.DoubleSide })
      );
      scene.add(bikeRightMesh);

      // 6. 우측 자전거도로 구분선 (백색)
      const bikeRightLineGeo = createStripGeometry(NUM_SEGMENTS);
      const bikeRightLineMesh = new THREE.Mesh(
        bikeRightLineGeo,
        new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide })
      );
      scene.add(bikeRightLineMesh);

      // 7. 좌측 깊고 차분한 실제 염하강 에메랄드 네이비 블루 수면
      const seaGeo = createStripGeometry(NUM_SEGMENTS);
      const seaMesh = new THREE.Mesh(
        seaGeo,
        new THREE.MeshLambertMaterial({
          color: 0x14556d, // 염하강: 차분한 짙은 청록-남청색
          emissive: 0x061c29,
          side: THREE.DoubleSide
        })
      );
      scene.add(seaMesh);

      // 8. 우측 김포 내륙 지형 (도로 갓길과 일체화되어 시야 차단 박멸)
      const landGeo = createStripGeometry(NUM_SEGMENTS);
      const landMesh = new THREE.Mesh(
        landGeo,
        new THREE.MeshLambertMaterial({
          color: 0x34865e, // 자연스러운 녹지
          emissive: 0x0b2417,
          side: THREE.DoubleSide
        })
      );
      scene.add(landMesh);

      // -------------------------------------------------------------------------
      // ★ 도로 양측 4열 이중 가드레일 (실버 그레이)
      // -------------------------------------------------------------------------
      // (1) 좌측 외측 가드레일 (자전거도로 바깥 강물 경계)
      const railLeftOuterGeo = createStripGeometry(NUM_SEGMENTS);
      const railLeftOuterMesh = new THREE.Mesh(
        railLeftOuterGeo,
        new THREE.MeshStandardMaterial({ color: 0xd1d5db, metalness: 0.85, roughness: 0.25, side: THREE.DoubleSide })
      );
      scene.add(railLeftOuterMesh);

      // (2) 좌측 내측 가드레일 (차도와 좌측 자전거길 사이 분리)
      const railLeftInnerGeo = createStripGeometry(NUM_SEGMENTS);
      const railLeftInnerMesh = new THREE.Mesh(
        railLeftInnerGeo,
        new THREE.MeshStandardMaterial({ color: 0xd1d5db, metalness: 0.85, roughness: 0.25, side: THREE.DoubleSide })
      );
      scene.add(railLeftInnerMesh);

      // (3) 우측 내측 가드레일 (차도와 우측 자전거길 사이 분리)
      const railRightInnerGeo = createStripGeometry(NUM_SEGMENTS);
      const railRightInnerMesh = new THREE.Mesh(
        railRightInnerGeo,
        new THREE.MeshStandardMaterial({ color: 0xd1d5db, metalness: 0.85, roughness: 0.25, side: THREE.DoubleSide })
      );
      scene.add(railRightInnerMesh);

      // (4) 우측 외측 가드레일 (우측 자전거길 바깥 숲 경계)
      const railRightOuterGeo = createStripGeometry(NUM_SEGMENTS);
      const railRightOuterMesh = new THREE.Mesh(
        railRightOuterGeo,
        new THREE.MeshStandardMaterial({ color: 0xd1d5db, metalness: 0.85, roughness: 0.25, side: THREE.DoubleSide })
      );
      scene.add(railRightOuterMesh);

      const guardrailPostGroup = new THREE.Group();
      scene.add(guardrailPostGroup);

      const treeGroup = new THREE.Group();
      scene.add(treeGroup);

      function createPineTree(seed = 0) {
        const g = new THREE.Group();
        const variant = seed % 3;
        const crownColors = [0x116a47, 0x178454, 0x267c4b];
        const trunk = new THREE.Mesh(
          new THREE.CylinderGeometry(0.18, 0.29, 2.5, 8),
          new THREE.MeshStandardMaterial({ color: 0x62432b, roughness: 0.92 })
        );
        trunk.position.y = 1.25;
        g.add(trunk);
        if (variant === 2) {
          const crown = new THREE.Mesh(
            new THREE.SphereGeometry(1.8, 9, 7),
            new THREE.MeshStandardMaterial({color: crownColors[variant], roughness: 0.9})
          );
          crown.position.y = 3.5;
          g.add(crown);
        } else {
          [0, 1].forEach(level => {
            const foliage = new THREE.Mesh(
              new THREE.ConeGeometry(level ? 1.15 : 1.65, level ? 2.35 : 2.8, 9),
              new THREE.MeshStandardMaterial({ color: crownColors[(variant + level) % crownColors.length], roughness: 0.9 })
            );
            foliage.position.y = level ? 4.25 : 3.2;
            g.add(foliage);
          });
        }
        return g;
      }

      // 도로 형상 리빌드
      function rebuildRoadGeometry() {
        for (const group of [guardrailPostGroup, treeGroup]) {
          while (group.children.length > 0) {
            const child = group.children[0];
            child.traverse(obj => {
              if (obj.isMesh) {
                obj.geometry.dispose();
                if (Array.isArray(obj.material)) obj.material.forEach(mat => mat.dispose());
                else obj.material.dispose();
              }
            });
            group.remove(child);
          }
        }

        const rPos = roadGeo.attributes.position.array;
        const cPos = centerLineGeo.attributes.position.array;
        const blPos = bikeLeftGeo.attributes.position.array;
        const bllPos = bikeLeftLineGeo.attributes.position.array;
        const brPos = bikeRightGeo.attributes.position.array;
        const brlPos = bikeRightLineGeo.attributes.position.array;
        const sPos = seaGeo.attributes.position.array;
        const lPos = landGeo.attributes.position.array;

        const rloPos = railLeftOuterGeo.attributes.position.array;
        const rliPos = railLeftInnerGeo.attributes.position.array;
        const rriPos = railRightInnerGeo.attributes.position.array;
        const rroPos = railRightOuterGeo.attributes.position.array;

        const postGeo = new THREE.CylinderGeometry(0.08, 0.08, 1.1, 8);
        const postMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.8 });

        for (let i = 0; i <= NUM_SEGMENTS; i++) {
          const d = (i % NUM_SEGMENTS) * step;
          const pt = getRoadCenterPoint(d);
          const leftVec = getRoadLeftVector(d);
          const rightVec = getRoadRightVector(d);

          // 차도 폭 7.3m (좌 3.65m, 우 3.65m)
          const pL = pt.clone().add(leftVec.clone().multiplyScalar(3.65));
          const pR = pt.clone().add(rightVec.clone().multiplyScalar(3.65));

          const v0 = (i * 2) * 3;
          const v1 = (i * 2 + 1) * 3;

          // 1. 차도 아스팔트 상판
          rPos[v0] = pL.x; rPos[v0 + 1] = pL.y; rPos[v0 + 2] = pL.z;
          rPos[v1] = pR.x; rPos[v1 + 1] = pR.y; rPos[v1 + 2] = pR.z;

          // 2. 황색 복선 중앙선
          const cL = pt.clone().add(leftVec.clone().multiplyScalar(0.14));
          const cR = pt.clone().add(rightVec.clone().multiplyScalar(0.14));
          cL.y += 0.04; cR.y += 0.04;

          cPos[v0] = cL.x; cPos[v0 + 1] = cL.y; cPos[v0 + 2] = cL.z;
          cPos[v1] = cR.x; cPos[v1 + 1] = cR.y; cPos[v1 + 2] = cR.z;

          // 3. ★ 좌측 수변 황토색 자전거 전용도로 (pL에서 수변 바깥으로 1.75m)
          const bL_inner = pL.clone();
          const bL_outer = pL.clone().add(leftVec.clone().multiplyScalar(1.75));
          bL_inner.y += 0.02; bL_outer.y += 0.02;

          blPos[v0] = bL_outer.x; blPos[v0 + 1] = bL_outer.y; blPos[v0 + 2] = bL_outer.z;
          blPos[v1] = bL_inner.x; blPos[v1 + 1] = bL_inner.y; blPos[v1 + 2] = bL_inner.z;

          // 좌측 자전거도로 백색 구분선
          const bll_L = pL.clone().add(leftVec.clone().multiplyScalar(0.06));
          const bll_R = pL.clone().add(leftVec.clone().multiplyScalar(0.13));
          bll_L.y += 0.03; bll_R.y += 0.03;

          bllPos[v0] = bll_L.x; bllPos[v0 + 1] = bll_L.y; bllPos[v0 + 2] = bll_L.z;
          bllPos[v1] = bll_R.x; bllPos[v1 + 1] = bll_R.y; bllPos[v1 + 2] = bll_R.z;

          // 4. ★ 우측 내륙 황토색 자전거 전용도로 (pR에서 숲 쪽으로 1.75m)
          const bR_inner = pR.clone();
          const bR_outer = pR.clone().add(rightVec.clone().multiplyScalar(1.75));
          bR_inner.y += 0.02; bR_outer.y += 0.02;

          brPos[v0] = bR_inner.x; brPos[v0 + 1] = bR_inner.y; brPos[v0 + 2] = bR_inner.z;
          brPos[v1] = bR_outer.x; brPos[v1 + 1] = bR_outer.y; brPos[v1 + 2] = bR_outer.z;

          // 우측 자전거도로 백색 구분선
          const brl_L = pR.clone().add(rightVec.clone().multiplyScalar(0.06));
          const brl_R = pR.clone().add(rightVec.clone().multiplyScalar(0.13));
          brl_L.y += 0.03; brl_R.y += 0.03;

          brlPos[v0] = brl_L.x; brlPos[v0 + 1] = brl_L.y; brlPos[v0 + 2] = brl_L.z;
          brlPos[v1] = brl_R.x; brlPos[v1 + 1] = brl_R.y; brlPos[v1 + 2] = brl_R.z;

          // 5. 좌측 깊은 에메랄드 염하강 해협 (bL_outer 끝에서 2,500m 바다)
          const seaNear = bL_outer.clone(); seaNear.y = 0.5;
          const seaFar = bL_outer.clone().add(leftVec.clone().multiplyScalar(2500)); seaFar.y = 0.5;

          sPos[v0] = seaNear.x; sPos[v0 + 1] = seaNear.y; sPos[v0 + 2] = seaNear.z;
          sPos[v1] = seaFar.x;  sPos[v1 + 1] = seaFar.y;  sPos[v1 + 2] = seaFar.z;

          // 6. 우측 김포 내륙 지형 사면 (bR_outer 끝에서 45m 완경사 사면)
          const landNear = bR_outer.clone();
          landNear.y = bR_outer.y - 0.18;
          const landFar = bR_outer.clone().add(rightVec.clone().multiplyScalar(45));
          landFar.y = 0.9 + Math.max(-0.35, Math.min(0.45, pt.y - 6.2)) * 0.18;

          lPos[v0] = landNear.x; lPos[v0 + 1] = landNear.y; lPos[v0 + 2] = landNear.z;
          lPos[v1] = landFar.x;  lPos[v1 + 1] = landFar.y;  lPos[v1 + 2] = landFar.z;

          // ---------------------------------------------------------------------
          // ★ 양측 4열 가드레일 설치
          // ---------------------------------------------------------------------
          // (1) 좌측 외측 가드레일 (bL_outer 수변 경계)
          const rlo_bot = bL_outer.clone().add(new THREE.Vector3(0, 0.40, 0));
          const rlo_top = bL_outer.clone().add(new THREE.Vector3(0, 0.75, 0));
          rloPos[v0] = rlo_bot.x; rloPos[v0 + 1] = rlo_bot.y; rloPos[v0 + 2] = rlo_bot.z;
          rloPos[v1] = rlo_top.x; rloPos[v1 + 1] = rlo_top.y; rloPos[v1 + 2] = rlo_top.z;

          // (2) 좌측 내측 가드레일 (pL 경계, 차도-자전거길 분리)
          const rli_bot = pL.clone().add(new THREE.Vector3(0, 0.40, 0));
          const rli_top = pL.clone().add(new THREE.Vector3(0, 0.75, 0));
          rliPos[v0] = rli_bot.x; rliPos[v0 + 1] = rli_bot.y; rliPos[v0 + 2] = rli_bot.z;
          rliPos[v1] = rli_top.x; rliPos[v1 + 1] = rli_top.y; rliPos[v1 + 2] = rli_top.z;

          // (3) 우측 내측 가드레일 (pR 경계, 차도-자전거길 분리)
          const rri_bot = pR.clone().add(new THREE.Vector3(0, 0.40, 0));
          const rri_top = pR.clone().add(new THREE.Vector3(0, 0.75, 0));
          rriPos[v0] = rri_bot.x; rriPos[v0 + 1] = rri_bot.y; rriPos[v0 + 2] = rri_bot.z;
          rriPos[v1] = rri_top.x; rriPos[v1 + 1] = rri_top.y; rriPos[v1 + 2] = rri_top.z;

          // (4) 우측 외측 가드레일 (bR_outer 경계, 자전거길-숲 분리)
          const rro_bot = bR_outer.clone().add(new THREE.Vector3(0, 0.40, 0));
          const rro_top = bR_outer.clone().add(new THREE.Vector3(0, 0.75, 0));
          rroPos[v0] = rro_bot.x; rroPos[v0 + 1] = rro_bot.y; rroPos[v0 + 2] = rro_bot.z;
          rroPos[v1] = rro_top.x; rroPos[v1 + 1] = rro_top.y; rroPos[v1 + 2] = rro_top.z;

          if (i % 4 === 0) {
            // 좌측 외측 기둥
            const p1 = new THREE.Mesh(postGeo, postMat);
            p1.position.copy(bL_outer).add(new THREE.Vector3(0, 0.45, 0));
            guardrailPostGroup.add(p1);

            // 좌측 내측 기둥
            const p2 = new THREE.Mesh(postGeo, postMat);
            p2.position.copy(pL).add(new THREE.Vector3(0, 0.45, 0));
            guardrailPostGroup.add(p2);

            // 우측 내측 기둥
            const p3 = new THREE.Mesh(postGeo, postMat);
            p3.position.copy(pR).add(new THREE.Vector3(0, 0.45, 0));
            guardrailPostGroup.add(p3);

            // 우측 외측 기둥
            const p4 = new THREE.Mesh(postGeo, postMat);
            p4.position.copy(bR_outer).add(new THREE.Vector3(0, 0.45, 0));
            guardrailPostGroup.add(p4);
          }

          // 소나무 (우측 지형에 정확히 안착)
          if (i % 7 === 0) {
            const tree = createPineTree(i);
            tree.scale.setScalar(0.72 + (i * 37 % 41) / 100);
            tree.rotation.y = (i * 1.618) % (Math.PI * 2);
            const treeOffset = 2.8 + (i * 13 % 15) * 0.4;
            const treePos = bR_outer.clone().add(rightVec.clone().multiplyScalar(treeOffset));
            // 나무 밑동이 사면의 보간된 지면에 닿도록 맞춤 (공중 부양 방지)
            const slopeT = Math.min(1, treeOffset / 45);
            const groundY = landNear.y + (landFar.y - landNear.y) * slopeT;
            treePos.y = groundY - 0.10;
            tree.position.copy(treePos);
            treeGroup.add(tree);
          }
        }

        roadGeo.attributes.position.needsUpdate = true;
        roadGeo.computeVertexNormals();

        centerLineGeo.attributes.position.needsUpdate = true;
        centerLineGeo.computeVertexNormals();

        bikeLeftGeo.attributes.position.needsUpdate = true;
        bikeLeftGeo.computeVertexNormals();

        bikeLeftLineGeo.attributes.position.needsUpdate = true;
        bikeLeftLineGeo.computeVertexNormals();

        bikeRightGeo.attributes.position.needsUpdate = true;
        bikeRightGeo.computeVertexNormals();

        bikeRightLineGeo.attributes.position.needsUpdate = true;
        bikeRightLineGeo.computeVertexNormals();

        seaGeo.attributes.position.needsUpdate = true;
        seaGeo.computeVertexNormals();

        landGeo.attributes.position.needsUpdate = true;
        landGeo.computeVertexNormals();

        railLeftOuterGeo.attributes.position.needsUpdate = true;
        railLeftOuterGeo.computeVertexNormals();

        railLeftInnerGeo.attributes.position.needsUpdate = true;
        railLeftInnerGeo.computeVertexNormals();

        railRightInnerGeo.attributes.position.needsUpdate = true;
        railRightInnerGeo.computeVertexNormals();

        railRightOuterGeo.attributes.position.needsUpdate = true;
        railRightOuterGeo.computeVertexNormals();
      }

      rebuildRoadGeometry();

      // 맞은편 차량 모델링 (차종 다양화: 세단, SUV, 승합차, 소형트럭)
      function addVehicleWheels(group, wheelOffsets) {
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.9 });
        const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.3, 12);
        wheelGeo.rotateZ(Math.PI / 2);
        wheelOffsets.forEach(p => {
          const w = new THREE.Mesh(wheelGeo, wheelMat);
          w.position.set(p[0], p[1], p[2]);
          group.add(w);
        });
      }

      function createSedanModel(color) {
        const car = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({ color, metalness: 0.72, roughness: 0.28 });
        const lowerBody = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.68, 4.5), bodyMat);
        lowerBody.position.y = 0.92;
        car.add(lowerBody);
        const cabin = new THREE.Mesh(
          new THREE.BoxGeometry(1.65, 0.65, 2.1),
          new THREE.MeshStandardMaterial({ color: 0x172033, roughness: 0.15, metalness: 0.88 })
        );
        cabin.position.set(0, 1.45, -0.1);
        car.add(cabin);
        const front = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.3, 0.08), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        front.position.set(0, 0.95, 2.24);
        car.add(front);
        const rear = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.12, 0.08), new THREE.MeshBasicMaterial({ color: 0xef4444 }));
        rear.position.set(0, 0.95, -2.24);
        car.add(rear);
        addVehicleWheels(car, [[-0.98, 0.42, 1.35], [0.98, 0.42, 1.35], [-0.98, 0.42, -1.35], [0.98, 0.42, -1.35]]);
        return car;
      }

      function createSUVModel(color) {
        const car = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({ color, metalness: 0.8, roughness: 0.2 });
        const lowerBody = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.85, 4.4), bodyMat);
        lowerBody.position.y = 1.0;
        car.add(lowerBody);
        const cabinMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.1, metalness: 0.9 });
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.8, 2.5), cabinMat);
        cabin.position.set(0, 1.75, -0.2);
        car.add(cabin);
        const hlL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.18, 0.1), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        hlL.position.set(-0.85, 1.05, 2.21);
        const hlR = hlL.clone();
        hlR.position.x = 0.85;
        car.add(hlL);
        car.add(hlR);
        const tl = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.15, 0.1), new THREE.MeshBasicMaterial({ color: 0xef4444 }));

        addVehicleWheels(car, [[-1.15, 0.45, 1.3], [1.15, 0.45, 1.3], [-1.15, 0.45, -1.3], [1.15, 0.45, -1.3]]);

      }

      function createVanModel(color) {
        const car = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({ color, metalness: 0.7, roughness: 0.25 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(2.35, 1.5, 5.0), bodyMat);

        car.add(body);
        const windshield = new THREE.Mesh(

        );
        windshield.position.set(0, 1.8, 1.0);

        const front = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.18, 0.08), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        front.position.set(0, 1.12, 2.52);
        car.add(front);
        const rear = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.14, 0.08), new THREE.MeshBasicMaterial({ color: 0xef4444 }));

        addVehicleWheels(car, [[-1.08, 0.45, 1.7], [1.08, 0.45, 1.7], [-1.08, 0.45, -1.7], [1.08, 0.45, -1.7]]);

      }

      function createMiniTruckModel(color) {
        const car = new THREE.Group();
        const cabMat = new THREE.MeshStandardMaterial({ color, metalness: 0.68, roughness: 0.35 });
        const cargoMat = new THREE.MeshStandardMaterial({ color: 0xe5e7eb, metalness: 0.25, roughness: 0.78 });
        const cab = new THREE.Mesh(new THREE.BoxGeometry(2.0, 1.35, 1.9), cabMat);
        cab.position.set(0, 1.2, 1.2);

        cargo.position.set(0, 1.15, -1.0);
        car.add(cargo);
        const front = new THREE.Mesh(new THREE.BoxGeometry(1.65, 0.18, 0.08), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        front.position.set(0, 1.0, 2.08);
        car.add(front);
        const rear = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.15, 0.08), new THREE.MeshBasicMaterial({ color: 0xef4444 }));
        rear.position.set(0, 1.0, -2.42);
        car.add(rear);
        addVehicleWheels(car, [[-0.95, 0.42, 1.0], [0.95, 0.42, 1.0], [-0.95, 0.42, -1.75], [0.95, 0.42, -1.75]]);
        return car;
      }

      const vehicleFactories = [
        { type: 'sedan', create: createSedanModel, colors: [0x2563eb, 0xf8fafc, 0x111827, 0xdc2626], speedRange: [33, 44] },
        { type: 'suv', create: createSUVModel, colors: [0x059669, 0xd97706, 0x475569, 0x7c3aed], speedRange: [31, 41] },
        { type: 'van', create: createVanModel, colors: [0xffffff, 0xf59e0b, 0x0f766e, 0x334155], speedRange: [28, 37] },
        { type: 'truck', create: createMiniTruckModel, colors: [0xdc2626, 0x0284c7, 0x475569, 0x16a34a], speedRange: [26, 35] }
      ];

      const ONCOMING_COUNT = 42;
      const oncomingCars = [];

      for (let i = 0; i < ONCOMING_COUNT; i++) {
        const typeIndex = i % 20;
        const profile = vehicleFactories[typeIndex < 9 ? 0 : typeIndex < 14 ? 1 : typeIndex < 17 ? 2 : 3];
        const color = profile.colors[(i * 7 + Math.floor(i / 4)) % profile.colors.length];
        const carMesh = profile.create(color);
        scene.add(carMesh);
        const minSpeed = profile.speedRange[0];
        const maxSpeed = profile.speedRange[1];
        const speed = minSpeed + ((i * 7) % (maxSpeed - minSpeed + 1));

        oncomingCars.push({
          group: carMesh,
          dist: ((TOTAL_ROAD_LENGTH / ONCOMING_COUNT) * (i + 0.10 * Math.sin(i * 17.3))) % TOTAL_ROAD_LENGTH,
          speed,
          type: profile.type
        });
      }

      // 카메라 위치
      let playerDist = 0;
      let playerSpeedKmh = 35;
      let isPaused = false;
      let viewMode = 2; // 승합차 시점 기본

      function updateCameraView() {
        const pt = getRoadCenterPoint(playerDist);
        const rightVec = getRoadRightVector(playerDist);
        const fwd = getRoadTangent(playerDist);

        let laneCenter = pt.clone().add(rightVec.clone().multiplyScalar(1.8));

        if (viewMode === 0) {
          camera.fov = 50;
          const pos = laneCenter.clone().sub(fwd.clone().multiplyScalar(7.2)).add(new THREE.Vector3(0, 3.0, 0));
          camera.position.copy(pos);
          const target = laneCenter.clone().add(fwd.clone().multiplyScalar(24));
          camera.lookAt(target);
        } else if (viewMode === 1) {
          camera.fov = 52;
          camera.position.set(laneCenter.x, laneCenter.y + 1.5, laneCenter.z).add(fwd.clone().multiplyScalar(0.55));
          const target = camera.position.clone().add(fwd.clone().multiplyScalar(38));
          camera.lookAt(target);
        } else if (viewMode === 2) {
          camera.fov = 50;
          camera.position.set(laneCenter.x, laneCenter.y + 1.8, laneCenter.z).sub(fwd.clone().multiplyScalar(1.4));
          const target = laneCenter.clone().add(fwd.clone().multiplyScalar(36)).add(new THREE.Vector3(0, 0.35, 0));
          camera.lookAt(target);
        }

        camera.updateProjectionMatrix();
      }

      // UI 이벤트 바인딩
      const headerSecName = document.getElementById('header-sec-name');
      const hudDist = document.getElementById('hud-dist');
      const hudTimer = document.getElementById('hud-timer');
      const hudSpeed = document.getElementById('hud-speed');

      const adjustDrawer = document.getElementById('adjust-drawer');
      const btnDrawerClose = document.getElementById('btn-drawer-close');
      const btnHeaderSecTrigger = document.getElementById('btn-header-sec-trigger');

      const toastPopup = document.getElementById('toast-popup');
      const toastText = document.getElementById('toast-text');

      let activeSectionIdx = 0;
      // 브라우저 실행 시 최초 시작 기준 시간. 일시정지/구간 이동에도 초기화되지 않음.
      const simulationStartTime = performance.now();

      function showToast(msg) {
        toastText.textContent = msg;
        toastPopup.classList.remove('opacity-0', '-translate-y-2');
        toastPopup.classList.add('opacity-100', 'translate-y-0');
        setTimeout(() => {
          toastPopup.classList.remove('opacity-100', 'translate-y-0');
          toastPopup.classList.add('opacity-0', '-translate-y-2');
        }, 2200);
      }

      function updateDrawerValues(idx) {
        activeSectionIdx = idx;
        const sec = sectionData[idx];
        document.getElementById('slider-amp').value = sec.amp;
        document.getElementById('slider-wl').value = Math.max(50, sec.wl);
        document.getElementById('slider-speed').value = Math.min(50, sec.speed);

        document.getElementById('drawer-amp-val').textContent = sec.amp + "m";
        document.getElementById('drawer-wl-val').textContent = Math.max(50, sec.wl) + "m";
        document.getElementById('drawer-speed-val').textContent = Math.min(50, sec.speed) + " km/h";

        document.querySelectorAll('.sec-tab-btn').forEach((btn, i) => {
          btn.className = (i === idx)
            ? "sec-tab-btn py-1.5 text-[11px] font-bold rounded-lg bg-emerald-500 text-slate-950"
            : "sec-tab-btn py-1.5 text-[11px] font-bold rounded-lg text-slate-400 hover:bg-slate-800";
        });
      }

      function toggleDrawer(open) {
        if (open) {
          adjustDrawer.classList.remove('translate-y-full');
          updateDrawerValues(activeSectionIdx);
        } else {
          adjustDrawer.classList.add('translate-y-full');
        }
      }

      btnHeaderSecTrigger.addEventListener('click', () => {
        const { idx } = getSectionAtDistance(playerDist);
        toggleDrawer(true);
        updateDrawerValues(idx);
      });

      btnDrawerClose.addEventListener('click', () => toggleDrawer(false));

      document.querySelectorAll('.sec-tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idx = parseInt(e.target.dataset.sec, 10);
          updateDrawerValues(idx);
          playerDist = sectionData[idx].start + 10;
        });
      });

      document.getElementById('slider-amp').addEventListener('input', e => document.getElementById('drawer-amp-val').textContent = e.target.value + "m");
      document.getElementById('slider-wl').addEventListener('input', e => document.getElementById('drawer-wl-val').textContent = e.target.value + "m");
      document.getElementById('slider-speed').addEventListener('input', e => document.getElementById('drawer-speed-val').textContent = Math.min(50, parseInt(e.target.value, 10)) + " km/h");

      document.getElementById('btn-save-section').addEventListener('click', () => {
        const amp = parseFloat(document.getElementById('slider-amp').value);
        const wl = parseFloat(document.getElementById('slider-wl').value);
        const spd = Math.min(50, parseInt(document.getElementById('slider-speed').value, 10));

        sectionData[activeSectionIdx].amp = amp;
        sectionData[activeSectionIdx].wl = wl;
        sectionData[activeSectionIdx].speed = spd;

        rebuildRoadPhase();
        rebuildRoadGeometry();
        toggleDrawer(false);
        showToast(`${sectionData[activeSectionIdx].name} 저장 완료!`);
      });

      document.getElementById('btn-reset-defaults').addEventListener('click', () => {
        sectionData = JSON.parse(JSON.stringify(defaultSections));
        rebuildRoadPhase();
        rebuildRoadGeometry();
        updateDrawerValues(activeSectionIdx);
        showToast("기본 설계값으로 복원되었습니다.");
      });

      function setViewMode(mode) {
        viewMode = mode;
        ['btn-view-drone1', 'btn-view-driver', 'btn-view-van'].forEach((id, idx) => {
          document.getElementById(id).className = (idx === mode)
            ? "px-2.5 py-1.5 rounded-xl text-xs font-black bg-emerald-500 text-slate-950"
            : "px-2.5 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700";
        });
      }

      document.getElementById('btn-view-drone1').addEventListener('click', () => setViewMode(0));
      document.getElementById('btn-view-driver').addEventListener('click', () => setViewMode(1));
      document.getElementById('btn-view-van').addEventListener('click', () => setViewMode(2));

      const btnPause = document.getElementById('btn-pause');
      btnPause.addEventListener('click', () => {
        isPaused = !isPaused;
        btnPause.innerHTML = isPaused ? "▶️ <span class='hidden sm:inline'>재생</span>" : "⏸️ <span class='hidden sm:inline'>일시정지</span>";
      });

      // 메인 애니메이션 루프
      let lastTime = performance.now();

      function animate() {
        requestAnimationFrame(animate);

        const now = performance.now();
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;

        // 실제 경과 시간은 프레임 속도나 일시정지 상태와 무관하게 최초 시작부터 계산.
        const totalElapsedTimeSec = Math.floor((now - simulationStartTime) / 1000);
        const mins = Math.floor(totalElapsedTimeSec / 60).toString().padStart(2, '0');
        const secs = (totalElapsedTimeSec % 60).toString().padStart(2, '0');
        hudTimer.textContent = `${mins}:${secs}`;

        if (!isPaused) {
          const { sec, idx } = getSectionAtDistance(playerDist);
          activeSectionIdx = idx;

          const targetKmh = Math.min(50, sec.speed || 35);
          playerSpeedKmh += (targetKmh - playerSpeedKmh) * 0.05;

          const mps = (playerSpeedKmh * 1000) / 3600;
          playerDist = (playerDist + mps * dt) % TOTAL_ROAD_LENGTH;

          headerSecName.textContent = `현재구간: ${sec.name}`;
          hudDist.textContent = `${Math.floor(playerDist).toLocaleString()} m`;
          hudSpeed.textContent = `${Math.round(playerSpeedKmh)} km/h`;

          // 맞은편 차량: 스쳐 지나감 (사라짐 없이 자연스러운 교행)
          oncomingCars.forEach(car => {
            const mps = (car.speed * 1000) / 3600;
            car.dist = ((car.dist - mps * dt) + TOTAL_ROAD_LENGTH) % TOTAL_ROAD_LENGTH;

            const pt = getRoadCenterPoint(car.dist);
            const leftVec = getRoadLeftVector(car.dist);
            const fwd = getRoadTangent(car.dist);

            const carPos = pt.clone().add(leftVec.clone().multiplyScalar(1.8));
            car.group.position.copy(carPos);

            const forward = fwd.clone().negate();
            car.group.lookAt(carPos.clone().add(forward));
          });
        }

        updateCameraView();

        renderer.render(scene, camera);
      }

      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    })();
  </script>
</body>
</html>
